# ---------------------------------------------------------
# This is a simple reverse-proxy redirection rule
# ---------------------------------------------------------
upstream esrh-front {
	server localhost:9301;
}

server {
    #if ($host = esrh-tp.clotaire-delanchy.fr) {
    #    return 301 https://$host$request_uri;
    #} # managed by Certbot


    listen 80;
    server_name esrh-tp.clotaire-delanchy.fr;

    location / {
        proxy_pass http://esrh-front;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connexion 'upgrade';
	proxy_set_header Host $host;
    }

    #rewrite ^ https://$http_host$request_uri? permanent;
    access_log /var/log/nginx/esrh.eriatolc.access.log;
}

