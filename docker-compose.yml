version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: hl7-fhir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidbox
      POSTGRES_USER: aidbox
      POSTGRES_PASSWORD: aidbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidbox -d aidbox"]
      interval: 10s
      timeout: 5s
      retries: 10

  aidbox:
    image: ${AIDBOX_IMAGE:-healthsamurai/aidbox:latest}
    container_name: hl7-fhir-aidbox
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIDBOX_HTTP_PORT: 8080
      AIDBOX_FHIR_BASE_URL: ${AIDBOX_FHIR_BASE_URL:-http://localhost:8080/fhir}
      AIDBOX_CLIENT_ID: ${AIDBOX_CLIENT_ID:-demo-client}
      AIDBOX_CLIENT_SECRET: ${AIDBOX_CLIENT_SECRET:-demo-secret}
      AIDBOX_LICENSE: ${AIDBOX_LICENSE:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: aidbox
      PGUSER: aidbox
      PGPASSWORD: aidbox
    ports:
      - "${AIDBOX_PORT:-8080}:8080"
    volumes:
      - aidbox-data:/var/lib/aidbox
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Future front-end service for the FHIR version.
  # This section is intentionally left as a placeholder for the Vue 3 / Vite app.
  # front:
  #   build: ./esrh-hl7-front-end
  #   container_name: hl7-fhir-front
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_AIDBOX_URL: http://localhost:8080/fhir

volumes:
  postgres-data:
  aidbox-data:
